[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendolby"
version = "0.1.0"
description = "Open-source Dolby DAX3 speaker tuning parser and PipeWire filter-chain generator for Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
opendolby = "opendolby.cli:main"

[tool.setuptools.packages.find]
include = ["opendolby*"]
